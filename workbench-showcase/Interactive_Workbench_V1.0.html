<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>交互式工作台 | Interactive Workbench V1.0</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:#10131c;color:#eef2ff}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.47}
a{color:inherit}
svg{flex-shrink:0}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent,#6366f1)}
input[type="range"]{accent-color:#8f83fb}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9587ff80;outline-offset:2px}
#app{min-height:100vh}
.workspace{--accent:#1677ff;--accent-on:#fff;--app-bg:#f8f9fc;--card:#fff;--text:#192337;--muted:#798397;--stroke:#e6e9ef;--sidebar:#fff;--side-text:#596277;--side-active:#efeaff;--radius:12px;--fsize:14px;--space:1;--shadow:0 6px 26px #1b2d4610;--family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;position:relative;display:flex;color:var(--text);font-family:var(--family);font-size:var(--fsize);line-height:1.48;background:var(--app-bg);min-height:790px;width:100%;isolation:isolate;overflow:hidden;transition:background .2s,color .2s}
.workspace *{box-sizing:border-box}
.workspace button,.workspace input,.workspace select,.workspace textarea{font:inherit}
.workspace button{border-radius:calc(var(--radius)*.65)}
.ws-sidebar{width:212px;flex:0 0 212px;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--stroke);color:var(--side-text);min-height:790px;padding:19px 11px 13px;transition:background .2s}
.ws-brand{display:flex;align-items:center;gap:9px;padding:0 10px 22px;color:var(--text);font-size:calc(15px * var(--site-font-scale,1));letter-spacing:-.4px;font-weight:850}
.ws-brand-mark{width:31px;height:31px;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;border-radius:10px;font-size:calc(15px * var(--site-font-scale,1));font-weight:950}
.ws-brand small{margin-left:auto;background:var(--app-bg);color:var(--muted);padding:3px 5px;border-radius:4px;letter-spacing:0;font-size:calc(9px * var(--site-font-scale,1))}
.ws-group-label{color:var(--muted);text-transform:uppercase;font-size:calc(9px * var(--site-font-scale,1));letter-spacing:1.6px;font-weight:850;margin:10px 11px 9px}
.ws-nav{display:grid;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--side-text);padding:10px 11px;width:100%;text-align:left;font-size:calc(11px * var(--site-font-scale,1))!important;font-weight:650;min-height:37px}
.nav-btn:hover{background:var(--side-active)}
.nav-btn.active{color:var(--accent);background:var(--side-active);font-weight:800}
.nav-btn .icon{width:17px;height:17px}
.nav-btn .num{margin-left:auto;color:var(--muted);font-size:calc(9px * var(--site-font-scale,1))}
.sidebar-bottom{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--stroke)}
.mini-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffbb8c,#a483f4);color:#fff;font-weight:850;font-size:calc(10px * var(--site-font-scale,1))}
.profile-line{display:flex;align-items:center;gap:8px}
.profile-line strong{display:block;font-size:calc(11px * var(--site-font-scale,1));color:var(--text)}
.profile-line small{font-size:calc(9px * var(--site-font-scale,1));color:var(--muted)}
.ws-main{min-width:0;flex:1;display:flex;flex-direction:column}
.ws-topbar{height:59px;min-height:59px;background:var(--card);border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:10px}
.crumbs{font-size:calc(11px * var(--site-font-scale,1));color:var(--muted)}
.crumbs b{color:var(--text)}
.top-controls{display:flex;gap:7px;align-items:center}
.ws-icon-btn{border:1px solid var(--stroke);background:var(--card);display:grid;place-items:center;width:32px;height:32px;color:var(--text);border-radius:8px}
.ws-icon-btn:hover{background:var(--side-active)}
.global-shortcut{background:var(--app-bg);border:1px solid var(--stroke);color:var(--muted);padding:7px 10px;border-radius:7px;font-size:calc(10px * var(--site-font-scale,1));white-space:nowrap}
.online-chip{color:#19996e;background:#e7f7ef;padding:5px 9px;border-radius:20px;font-size:calc(10px * var(--site-font-scale,1));font-weight:800}
.ws-content{padding:24px 24px 34px;flex:1;min-width:0}
.ws-page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:19px;flex-wrap:wrap}
.page-kicker{color:var(--accent);font-size:calc(10px * var(--site-font-scale,1));font-weight:850;letter-spacing:1.25px;text-transform:uppercase;margin-bottom:7px}
.ws-page-header h1{font-size:calc(var(--fsize)*1.76);line-height:1.22;letter-spacing:-.7px;font-weight:850;margin:0}
.ws-page-header p{font-size:calc(var(--fsize)*.77);color:var(--muted);margin:7px 0 0;line-height:1.6;max-width:700px}
.toolbar-buttons{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--stroke);color:var(--text);background:var(--card);padding:9px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:calc(var(--fsize)*.78)!important;font-weight:740;min-height:34px;white-space:nowrap;transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn.soft{color:var(--accent);background:var(--side-active);border-color:transparent}
.btn.danger{background:#e5484d;color:white;border-color:#e5484d}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 9px;min-height:28px}
.btn.lg{padding:13px 21px;font-size:var(--fsize)!important}
.btn.loading::before{content:"";width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.btn:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:19px}
.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-heading h3{margin:0;font-size:calc(var(--fsize)*1.03);font-weight:830}
.card-heading p{margin:5px 0 0;font-size:calc(var(--fsize)*.74);color:var(--muted)}
.section-title{font-size:calc(var(--fsize)*1.1);font-weight:850;letter-spacing:-.25px;margin:25px 0 13px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.split-64{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(220px,1fr);gap:14px}
.split-73{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(200px,1fr);gap:14px}
.gap-12{display:grid;gap:12px}
.gap-16{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.tiny{font-size:calc(var(--fsize)*.75)}
.small-text{font-size:calc(var(--fsize)*.83)}
.bold{font-weight:800}
.top-gap{margin-top:14px}
.mb-0{margin-bottom:0!important}
.divider{border:0;border-top:1px solid var(--stroke);margin:16px 0}
.badge{display:inline-flex;align-items:center;border-radius:100px;padding:4px 9px;background:var(--side-active);color:var(--accent);font-weight:800;font-size:calc(var(--fsize)*.7)}
.badge.success{background:#e4f8ed;color:#14885d}
.badge.warning{background:#fff3dd;color:#a96a13}
.badge.error{background:#ffeaec;color:#c8354e}
.badge.neutral{background:var(--app-bg);color:var(--muted)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px}
.metric-card{padding:18px;position:relative;overflow:hidden}
.metric-card .label{color:var(--muted);font-size:calc(var(--fsize)*.79);font-weight:660}
.metric-card .figure{font-size:calc(var(--fsize)*1.8);font-weight:870;letter-spacing:-1px;margin:10px 0 5px}
.metric-card .change{font-size:calc(var(--fsize)*.72);color:#1f9b71}
.metric-icon{position:absolute;top:15px;right:15px;width:31px;height:31px;display:grid;place-items:center;background:var(--side-active);color:var(--accent);border-radius:9px}
.hero-card{background:var(--accent);color:var(--accent-on);padding:23px 24px;border-radius:var(--radius);position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;min-height:123px}
.hero-card:after{content:"";width:220px;height:220px;border:33px solid #ffffff16;border-radius:50%;position:absolute;right:70px;top:-140px}
.hero-card h2{font-size:calc(var(--fsize)*1.35);margin:8px 0;line-height:1.25}
.hero-card p{font-size:calc(var(--fsize)*.8);opacity:.81;margin:0}
.hero-card .hero-pill{background:#ffffff27;color:#fff;border-radius:100px;padding:8px 11px;font-size:calc(10px * var(--site-font-scale,1));font-weight:800;position:relative;z-index:1}
.overview-chart{width:100%;height:auto;max-height:235px;display:block}
.chart-grid{stroke:var(--stroke);stroke-width:1}
.chart-label{fill:var(--muted);font-size:calc(10px * var(--site-font-scale,1))}
.chart-area{fill:var(--accent);opacity:.09}
.chart-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart-dot{fill:var(--card);stroke:var(--accent);stroke-width:3}
.chart-bar{fill:var(--accent);opacity:.83}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--stroke)}
.activity-item:last-child{border-bottom:0}
.activity-square{height:33px;width:33px;background:var(--side-active);color:var(--accent);border-radius:10px;display:grid;place-items:center;flex:none}
.activity-item strong{font-size:calc(var(--fsize)*.82)}
.activity-item p{margin:4px 0 0;color:var(--muted);font-size:calc(var(--fsize)*.72)}
.activity-item time{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:calc(var(--fsize)*.7)}
.table-wrap{overflow:auto;width:100%}
.data-table{width:100%;border-collapse:collapse;font-size:calc(var(--fsize)*.76);white-space:nowrap}
.data-table th{padding:12px 15px;text-align:left;background:var(--app-bg);color:var(--muted);font-weight:790;border-bottom:1px solid var(--stroke)}
.data-table td{padding:13px 15px;border-bottom:1px solid var(--stroke)}
.data-table tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:var(--side-active)}
.data-table th.sortable{cursor:pointer}
.data-table th.sortable:hover{color:var(--accent)}
.table-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.control-input,.control-select,.control-textarea{background:var(--card);border:1px solid var(--stroke);border-radius:calc(var(--radius)*.6);color:var(--text);padding:9px 12px;outline:none;min-height:36px;max-width:100%;font-size:calc(var(--fsize)*.82)!important}
.control-input:focus,.control-select:focus,.control-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--side-active)}
.control-textarea{min-height:90px;width:100%;resize:vertical}
.control-input::placeholder,.control-textarea::placeholder{color:var(--muted)}
.field{display:grid;gap:7px}
.field label{font-weight:750;font-size:calc(var(--fsize)*.79)}
.field small{color:var(--muted);font-size:calc(var(--fsize)*.7)}
.field .control-input,.field .control-select{width:100%}
.field-error{color:#e5484d!important}
.checkline{display:flex;align-items:center;gap:8px;font-size:calc(var(--fsize)*.8);cursor:pointer}
.toggle{appearance:none;width:37px;height:21px;border-radius:100px;background:#c8d0dd;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle:before{content:"";height:15px;width:15px;position:absolute;top:3px;left:3px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:.2s}
.toggle:checked{background:var(--accent)}
.toggle:checked:before{transform:translateX(16px)}
.progress-track{height:7px;border-radius:20px;background:var(--app-bg);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
.segmented{display:inline-flex;gap:2px;background:var(--app-bg);border:1px solid var(--stroke);border-radius:calc(var(--radius)*.7);padding:3px}
.segmented button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font-size:calc(var(--fsize)*.72)!important;font-weight:740}
.segmented button.selected{color:var(--accent);background:var(--card);box-shadow:0 2px 9px #0000000b}
.component-demo{padding:17px;display:grid;gap:12px;min-height:158px}
.component-demo h4{margin:0;font-size:calc(var(--fsize)*.9)}
.demo-hint{font-size:calc(var(--fsize)*.7);color:var(--muted)}
.demo-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.alert{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--stroke);border-radius:calc(var(--radius)*.7);background:var(--side-active);color:var(--text);padding:12px;font-size:calc(var(--fsize)*.79)}
.alert.success{background:#e6f8ee;color:#126e4e;border-color:#bee9d1}
.alert.warning{background:#fff7e6;color:#9a6115;border-color:#f8dfad}
.alert.error{background:#fff0f1;color:#a82a38;border-color:#f8c4c9}
.stepper{display:flex;align-items:center;gap:4px}
.step-circle{width:25px;height:25px;border-radius:50%;background:var(--app-bg);border:1px solid var(--stroke);display:grid;place-items:center;font-size:calc(10px * var(--site-font-scale,1));font-weight:850;color:var(--muted)}
.step-circle.done{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.step-line{height:2px;background:var(--stroke);flex:1}
.step-line.done{background:var(--accent)}
.accordion{border:1px solid var(--stroke);border-radius:calc(var(--radius)*.7);overflow:hidden}
.accordion-item{border-bottom:1px solid var(--stroke)}
.accordion-item:last-child{border-bottom:0}
.accordion-item>button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--text);padding:13px;font-size:calc(var(--fsize)*.82);font-weight:730}
.accordion-item .accordion-body{padding:0 13px 13px;color:var(--muted);font-size:calc(var(--fsize)*.75)}
.skeleton{background:linear-gradient(110deg,var(--app-bg) 12%,var(--stroke) 33%,var(--app-bg) 55%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:5px;height:13px}
.dropzone{padding:22px;border:1.5px dashed var(--stroke);border-radius:var(--radius);background:var(--app-bg);text-align:center;color:var(--muted);font-size:calc(var(--fsize)*.78);cursor:pointer}
.dropzone:hover{border-color:var(--accent);color:var(--accent)}
.form-summary{padding:17px;background:var(--app-bg);border-radius:calc(var(--radius)*.7);border:1px solid var(--stroke)}
.form-summary dl{display:grid;grid-template-columns:85px 1fr;gap:11px;font-size:calc(var(--fsize)*.78);margin:0}
.form-summary dt{color:var(--muted)}
.form-summary dd{margin:0;font-weight:720;word-break:break-word}
.kanban-board{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;overflow:auto}
.kanban-lane{border:1px solid var(--stroke);border-radius:var(--radius);background:var(--app-bg);padding:12px;min-height:390px;display:flex;flex-direction:column;gap:9px}
.kanban-lane.dragover{outline:2px dashed var(--accent)}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 1px 8px;font-size:calc(var(--fsize)*.86);font-weight:830}
.task-card{background:var(--card);border:1px solid var(--stroke);border-radius:calc(var(--radius)*.8);padding:12px;cursor:grab;box-shadow:var(--shadow)}
.task-card:hover{border-color:var(--accent)}
.task-card h4{margin:10px 0 8px;font-size:calc(var(--fsize)*.8);font-weight:820}
.task-card p{color:var(--muted);font-size:calc(var(--fsize)*.71);margin:0 0 12px;line-height:1.6}
.task-foot{display:flex;align-items:center;justify-content:space-between;gap:5px}
.task-foot .mini-avatar{width:25px;height:25px;font-size:calc(9px * var(--site-font-scale,1))}
.mini-date{font-size:calc(var(--fsize)*.68);color:var(--muted)}
.task-arrows{display:flex;gap:3px}
.task-arrows button{border:1px solid var(--stroke);color:var(--muted);background:var(--card);width:22px;height:22px;border-radius:5px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:17px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--stroke);border-left:1px solid var(--stroke);border-radius:9px;overflow:hidden}
.calendar-week{background:var(--app-bg);border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:9px 0;text-align:center;font-size:calc(var(--fsize)*.7);font-weight:800;color:var(--muted)}
.calendar-day{height:88px;border:0;border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke);background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:9px;min-width:0;text-align:left}
.calendar-day:hover{background:var(--side-active)}
.calendar-day.other{opacity:.36}
.calendar-day.selected{box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.calendar-day.today .day-number{background:var(--accent);color:var(--accent-on)}
.day-number{min-width:23px;height:23px;padding:3px 6px;display:grid;place-items:center;border-radius:50%;font-size:calc(var(--fsize)*.76);font-weight:750}
.event-line{display:block;background:var(--side-active);color:var(--accent);padding:3px 5px;width:100%;font-size:calc(var(--fsize)*.62);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--stroke);font-size:calc(var(--fsize)*.77)}
.event-row time{font-weight:800;color:var(--accent);white-space:nowrap}
.analytics-heatmap{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--accent);opacity:var(--opacity)}
.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--accent) 0 47%,#64c6b2 47% 72%,#f2b86e 72% 87%,#c0c7d7 87%);position:relative;display:grid;place-items:center;margin:auto}
.donut:after{content:"";width:115px;height:115px;background:var(--card);border-radius:50%;position:absolute}
.donut-center{position:relative;z-index:1;display:grid;text-align:center}
.donut-center strong{font-size:calc(var(--fsize)*1.4)}
.donut-center small{font-size:calc(var(--fsize)*.75);color:var(--muted)}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:calc(var(--fsize)*.78)}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.agent-card{padding:17px;display:grid;gap:12px}
.agent-card .agent-meta{display:flex;gap:8px;align-items:center}
.agent-illustration{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:var(--side-active);color:var(--accent)}
.agent-card h3{margin:0;font-size:calc(var(--fsize)*.88)}
.agent-card p{margin:0;color:var(--muted);font-size:calc(var(--fsize)*.74);min-height:37px}
.workflow{display:flex;align-items:center;gap:4px;min-width:0}
.workflow-node{flex:1;text-align:center;padding:6px 3px;background:var(--app-bg);border:1px solid var(--stroke);border-radius:5px;font-size:calc(var(--fsize)*.65);white-space:nowrap}
.workflow-connector{height:1px;width:8px;background:var(--muted);flex-shrink:0}
.agent-card .agent-footer{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--stroke);padding-top:12px}
.media-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.media-item{border-radius:var(--radius);overflow:hidden;border:1px solid var(--stroke);background:var(--card);cursor:pointer}
.media-item:hover{box-shadow:0 0 0 2px var(--accent)}
.media-item img{width:100%;aspect-ratio:1.5;object-fit:cover;display:block;background:var(--app-bg)}
.media-caption{padding:11px}
.media-caption strong{font-size:calc(var(--fsize)*.8);display:block}
.media-caption small{font-size:calc(var(--fsize)*.7);color:var(--muted)}
.icon-catalog{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}

/* ===== Interactive Workbench V1.0 ===== */

/* Login: editorial two-column canvas with an original, animated fox */
.v6-login-screen{height:100dvh;min-height:620px;padding:clamp(12px,2vw,26px);background:#ebeaf5;overflow-y:auto}
.v6-login-card{width:min(1320px,100%);min-height:min(760px,calc(100dvh - 52px));grid-template-columns:minmax(0,1.05fr) minmax(430px,.95fr);border-radius:34px;box-shadow:0 42px 110px #25205228;border:1px solid #ffffffd6}
.v6-login-hero{overflow:hidden;justify-content:space-between;background:#241747;background-image:radial-gradient(ellipse at 85% 9%,#7264e9 0,transparent 37%),radial-gradient(circle at 2% 81%,#7150d6 0,transparent 32%),linear-gradient(150deg,#151b42,#392573 52%,#6e4aaf);padding:37px clamp(26px,4vw,66px) 24px;gap:22px}
.v6-login-hero:after{width:490px;height:490px;bottom:-220px;right:-150px;border:1px solid #ffffff18}
.iw-login-glow{position:absolute;width:370px;height:370px;right:-90px;top:-160px;background:#6d76f7;filter:blur(95px);opacity:.5;pointer-events:none}
.iw-hero-top{display:flex;align-items:center;gap:11px;position:relative;z-index:2;color:white}.iw-hero-top strong{font-size:17px;letter-spacing:-.35px;white-space:nowrap}.iw-hero-mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#ffffff21;border:1px solid #ffffff3b}.iw-version{font-size:11px;letter-spacing:1px;color:#e4dcff;border:1px solid #ffffff45;border-radius:999px;padding:6px 10px;margin-left:auto}
.iw-hero-middle{position:relative;z-index:1;display:grid;justify-items:start}.iw-hero-kicker{font-size:12px;letter-spacing:3px;color:#d6caff;font-weight:800}.v6-login-hero h1{font-size:clamp(40px,4.1vw,69px);line-height:1.1;margin:17px 0 17px;font-weight:860;letter-spacing:-2.7px}.v6-login-hero h1 span{display:block;background:linear-gradient(90deg,#ffe59a,#ffb0c4 53%,#d3d3ff);background-clip:text;-webkit-background-clip:text;color:transparent}.v6-login-hero p{max-width:440px;font-size:16px;color:#e6dfff;line-height:1.75}
.iw-fox-stage{position:relative;width:min(360px,90%);height:300px;justify-self:center;align-self:end;margin:8px 0 0;display:grid;place-items:center}.iw-fox-halo{position:absolute;inset:26px 25px 12px;border:1px solid #ffffff4d;box-shadow:0 0 0 26px #ffffff08,0 0 0 52px #ffffff04;border-radius:50%}.iw-fox{width:min(340px,100%);max-height:290px;z-index:1;overflow:visible;filter:drop-shadow(0 22px 20px #0e0a3859)}.iw-fox-spark{position:absolute;color:#ffe9ae;font-size:29px;animation:iw-twinkle 3s ease-in-out infinite}.iw-fox-spark.s1{top:45px;right:6px}.iw-fox-spark.s2{top:120px;left:8px;animation-delay:1s}.iw-fox-tip{position:absolute;z-index:3;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;padding:8px 15px;border:1px solid #ffffff45;background:#ffffff1b;color:#f9edff;border-radius:99px;backdrop-filter:blur(7px)}
.iw-paw{transform-box:fill-box;transform-origin:center bottom;transition:transform .48s cubic-bezier(.2,1.5,.4,1)}.iw-fox-stage[data-cover="true"] .iw-paw-l{transform:translate(31px,-75px) rotate(-11deg)}.iw-fox-stage[data-cover="true"] .iw-paw-r{transform:translate(-31px,-75px) rotate(11deg)}.iw-fox-stage[data-cover="true"] .iw-fox-eyes{opacity:.15}.iw-fox-eyes{transition:opacity .2s ease}.iw-fox-stage[data-cover="true"] .iw-fox-tip{background:#fff1db2e}
.iw-hero-bottom{display:flex;flex-wrap:wrap;gap:12px;color:#ddd5ff;font-size:12px;position:relative;z-index:1}.iw-hero-bottom span{padding:8px 10px;border-radius:99px;border:1px solid #ffffff25;background:#ffffff0c}
.v6-login-form-wrap{position:relative;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 99% 5%,#faf7ff,#fff 45%);padding:36px clamp(25px,5vw,77px) 24px}
.v6-login-form{padding:0;gap:12px;max-width:460px;width:100%;margin:auto}.v6-login-top{margin-bottom:20px}.v6-login-kicker{font-size:12px;color:#6954dd;letter-spacing:1.8px}.v6-login-top h2{font-size:clamp(30px,3vw,41px);letter-spacing:-1.2px;color:#151a32;margin:14px 0 11px}.v6-login-top p{font-size:15px;color:#747b8b;line-height:1.6}.v6-login-form>label{font-size:15px;color:#222c44;font-weight:780;margin-top:8px}.v6-login-form input:not([type=checkbox]){height:57px;border:1px solid #dde1ee;border-radius:15px;font-size:16px;padding:12px 17px;box-shadow:0 2px 4px #1d194808;transition:border .18s,box-shadow .18s}.v6-login-form input:focus{border-color:#8068ef;box-shadow:0 0 0 4px #8068ef1b;outline:0}.v6-password-wrap input{padding-right:56px!important}.v6-password-wrap button{width:43px;height:43px;right:8px;color:#6954bb}.iw-password-hint{font-size:12px;color:#81869c;margin-top:-2px;min-height:18px}.v6-remember-line{font-size:13px;margin:8px 0 0}.v6-login-submit{min-height:56px;margin-top:4px;border-radius:15px;font-size:16px;box-shadow:0 12px 25px #6254df36;transition:transform .2s,box-shadow .2s}.v6-login-submit:hover{transform:translateY(-2px);box-shadow:0 15px 30px #6254df50}.v6-login-submit:active{transform:translateY(0)}
.iw-auth-switch{display:flex;align-items:center;gap:6px;justify-content:center;margin:11px 0;color:#70788d;font-size:13px}.iw-auth-switch button{border:0;background:transparent;color:#6254df;font-weight:800;text-decoration:underline;text-underline-offset:3px}.iw-auth-footer{text-align:center;font-size:12px;color:#a3a6b2;margin-top:auto;padding-top:30px}

function labHexLuminance(hex){let h=/^#[0-9a-f]{6}$/i.test(hex)?hex:'#6254df';const v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(n=>n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function labContrast(a,b){let L1=labHexLuminance(a),L2=labHexLuminance(b);return (Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05)}
function labAuditPage(){

function getLocalAccount(){try{const raw=localStorage.getItem(ACCOUNT_KEY);return raw?JSON.parse(raw):null}catch{return null}}
function getLocalAccounts(){
 let accounts=[];
 try{const stored=JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'[]');if(Array.isArray(stored))accounts=stored.filter(x=>x&&x.username&&x.id)}catch{}
 // Read v1.0's original single-account storage without dropping existing user records.
 const legacy=getLocalAccount();
 if(legacy?.id&&!accounts.some(x=>x.id===legacy.id||String(x.username).toLowerCase()===String(legacy.username).toLowerCase()))accounts.push(legacy);
 return accounts;

async function derivePassword(password,salt){
 if(!globalThis.crypto?.subtle)throw Error(T('当前环境无法安全创建本地账号，请通过 HTTPS 或支持安全上下文的浏览器打开。','Secure cryptography is unavailable. Use HTTPS or a browser supporting secure contexts.'));
 const bytes=new TextEncoder().encode(password);
 const material=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt),iterations:125000,hash:'SHA-256'},material,256);
 return Array.from(new Uint8Array(bits)).map(n=>n.toString(16).padStart(2,'0')).join('');
}
function loadAuth(){
 const stores=[];try{stores.push(sessionStorage)}catch{}try{stores.push(localStorage)}catch{}
 for(const store of stores){try{
  const raw=store.getItem(AUTH_KEY);if(!raw)continue;
  const session=JSON.parse(raw);
  if(!session||session.expiry<=Date.now())continue;
  if(session.id===BUILTIN_DEMO.id||getLocalAccounts().some(a=>a.id===session.id))return session;
 }catch{}}
 return null;
}

async function submitAuth(){
 if(authBusy)return;
 const accountField=document.getElementById('v6-account'),passField=document.getElementById('v6-password'),err=document.getElementById('v6-login-error');
 const username=String(accountField?.value||'').trim(),password=String(passField?.value||'');
 const signup=authMode==='signup';
 if(!username||password.length<8){if(err){err.dataset.state='error';err.textContent=T('请输入账号和至少 8 位密码','Enter an account and a password of at least 8 characters')}(!username?accountField:passField)?.focus();return}
 authBusy=true;
 const submit=document.querySelector('.v6-login-submit');
 const initialButtonMarkup=submit?.innerHTML||'';
 if(err){err.dataset.state='pending';err.textContent=T('正在验证账号，请稍候…','Verifying credentials…')}
 if(submit){submit.disabled=true;submit.setAttribute('aria-busy','true');submit.innerHTML='<span class="iw-auth-spinner" aria-hidden="true"></span><span>'+T('正在登录…','Signing in…')+'</span>'}
 // Allow browsers to display the pending state before processing local accounts.
 try{
  let account;
  if(signup){
   if(!/^[^\s]{2,48}$/u.test(username))throw Error(T('账号应为 2–48 个不含空格的字符','Account must be 2–48 characters with no spaces'));
   if(username.toLowerCase()===BUILTIN_DEMO.username||findLocalAccount(username))throw Error(T('该账号已经存在，请直接登录','This account already exists. Sign in instead.'));
   if(!globalThis.crypto?.getRandomValues)throw Error(T('浏览器不支持账号创建所需的随机数功能','Your browser cannot generate the random values required for registration'));
   const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));
   const hash=await derivePassword(password,salt);
   account={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),username,displayName:username,salt,hash};
   const accounts=getLocalAccounts();accounts.push(account);
   localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts));
  }else if(username.toLowerCase()===BUILTIN_DEMO.username&&password===BUILTIN_DEMO_PASSWORD){
   account=BUILTIN_DEMO;
  }else{
   account=findLocalAccount(username);
   if(!account||await derivePassword(password,account.salt)!==account.hash)throw Error(T('账号或密码不正确','Incorrect account or password'));
  }
  const remember=Boolean(document.getElementById('v6-remember')?.checked);
  currentUser={id:account.id,name:account.displayName||account.username,en:account.displayName||account.username,role:T('工作区管理员','Workspace administrator'),expiry:Date.now()+(remember?7:1)*86400000};
  persistAuth(currentUser,remember);
  authMode='signin';if(WORKBENCH_ENTRY==='unified')render({resetScroll:true});else window.location.assign(WORKBENCH_INDEX_FILE);return;
 }catch(e){
  console.error('[Interactive Workbench] Authentication failed:',e);
  const visibleError=document.getElementById('v6-login-error');
  if(visibleError){visibleError.dataset.state='error';visibleError.textContent=e?.message||T('登录失败，请检查账号密码后重试','Login failed. Check credentials and try again.')}
  passField?.focus();
 }
 finally{
  authBusy=false;
  if(submit?.isConnected){submit.disabled=false;submit.removeAttribute('aria-busy');submit.innerHTML=initialButtonMarkup}
 }
}

function syncSidebarState(){
 const w=$('#workspace'),btn=w?.querySelector('.nf-brand-toggle'),aside=w?.querySelector('.ws-sidebar');
 if(!w||!btn)return;
 const mobile=isMobile();
 w.classList.toggle('nav-collapsed',Boolean(state.navCollapsed));

function setSidebarWidth(value,save=true){
 state.sidebarWidth=Math.max(196,Math.min(420,Math.round(Number(value)||248)));
 const ws=$('#workspace');ws?.style.setProperty('--ws-sidebar-width',state.sidebarWidth+'px');
 const handle=$('#nav-resize-handle');handle?.setAttribute('aria-valuenow',String(state.sidebarWidth));
 const reading=$('#sidebar-width-reading');if(reading)reading.textContent=state.sidebarWidth+'px';
 const range=document.querySelector('[data-range-setting="sidebarWidth"]');if(range)range.value=String(state.sidebarWidth);
 if(save)persist();
}
let navDragging=false;
document.addEventListener('pointerdown',event=>{
 const handle=event.target.closest('#nav-resize-handle');if(!handle||event.button!==0)return;
 if(isMobile()||state.navCollapsed)return;
 navDragging=true;document.body.classList.add('nf-is-resizing');
 try{handle.setPointerCapture(event.pointerId)}catch{}
 event.preventDefault();
});
document.addEventListener('pointermove',event=>{
 if(!navDragging)return;
 const side=$('#ws-primary-sidebar');if(!side)return;
 const rect=side.getBoundingClientRect();
 const direction=getComputedStyle(side).direction==='rtl'?-1:1;
 const next=direction===1?event.clientX-rect.left:rect.right-event.clientX;
 setSidebarWidth(next,false);
});
document.addEventListener('pointerup',()=>{if(navDragging){navDragging=false;document.body.classList.remove('nf-is-resizing');persist()}});
document.addEventListener('pointercancel',()=>{if(navDragging){navDragging=false;document.body.classList.remove('nf-is-resizing');persist()}});
document.addEventListener('keydown',event=>{
 if(event.target?.id!=='nav-resize-handle')return;
 if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();setSidebarWidth(state.sidebarWidth+(event.key==='ArrowRight'?12:-12))}
 if(event.key==='Home'){event.preventDefault();setSidebarWidth(196)}
 if(event.key==='End'){event.preventDefault();setSidebarWidth(420)}
});
document.addEventListener('dblclick',event=>{if(event.target.closest('#nav-resize-handle'))setSidebarWidth(248)});
function act(action,el){if(labHandleAction(action,el))return;switch(action){
 case 'save-page':saveEffect(pageById(state.page)[state.lang==='zh'?2:3],'page');return;
 case 'save-component':saveEffect(el.dataset.value,'component');refreshCurrentPage();return;
 case 'clear-components':state.selectedEffects=state.selectedEffects.filter(x=>x.type!=='component');saveEffects();render({keepDoc:true});return;
 case 'remove-effect':state.selectedEffects=state.selectedEffects.filter(x=>x.id!==el.dataset.id);saveEffects();render({keepDoc:true});return;
 case 'switch-mode':setSetting('mode',state.mode==='light'?'dark':'light');return;
